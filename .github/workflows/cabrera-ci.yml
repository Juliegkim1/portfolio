name: Cabrera Construction App CI

on:
  push:
    branches: [main]
    paths: ["cabrera_construction_app/app/**"]
  pull_request:
    paths: ["cabrera_construction_app/app/**"]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cabrera
          POSTGRES_PASSWORD: cabrera
          POSTGRES_DB: cabrera_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cabrera"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: cabrera_construction_app/app/backend
        run: uv sync --all-groups

      - name: Run pytest
        working-directory: cabrera_construction_app/app/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://cabrera:cabrera@localhost:5432/cabrera_test
        run: uv run pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: cabrera_construction_app/app/frontend/package-lock.json

      - name: Install dependencies
        working-directory: cabrera_construction_app/app/frontend
        run: npm ci

      - name: Type-check and build
        working-directory: cabrera_construction_app/app/frontend
        run: npm run build
