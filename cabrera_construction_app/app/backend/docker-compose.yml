services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cabrera
      POSTGRES_PASSWORD: cabrera
      POSTGRES_DB: cabrera
    ports:
      - "5432:5432"
    volumes:
      - cabrera_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cabrera"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://cabrera:cabrera@db:5432/cabrera
      SEED_ON_STARTUP: "true"
      CORS_ORIGINS: '["http://localhost:5173"]'
      TEMPLATES_DIR: /templates
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ../../templates:/templates:ro
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  cabrera_db_data:
